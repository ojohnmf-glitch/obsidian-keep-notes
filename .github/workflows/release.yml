# Publica uma release do plugin a cada tag de versão (ex.: 0.1.0),
# anexando manifest.json, main.js e styles.css. É o formato que o
# Obsidian e o BRAT esperam.
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confere se a tag bate com o manifest
        run: |
          versao=$(node -p "require('./manifest.json').version")
          if [ "$versao" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME difere da versão $versao no manifest.json"; exit 1
          fi

      - name: Cria a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "Instale com BRAT ou copie manifest.json, main.js e styles.css para .obsidian/plugins/keep-notes/." \
            manifest.json main.js styles.css
