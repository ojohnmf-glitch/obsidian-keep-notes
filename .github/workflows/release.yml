# Publica uma release do plugin com manifest.json, main.js e styles.css
# anexados (formato que o Obsidian e o BRAT esperam). A versão vem do
# manifest.json; a tag é criada pela própria Action.
# Dispara ao mudar o manifest no main ou manualmente (Actions → Release → Run workflow).
name: Release

on:
  push:
    branches: [main]
    paths: [manifest.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cria a release se a versão ainda não existe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          versao=$(node -p "require('./manifest.json').version")
          if gh release view "$versao" >/dev/null 2>&1; then
            echo "Release $versao já existe; nada a fazer."; exit 0
          fi
          gh release create "$versao" \
            --target "$GITHUB_SHA" \
            --title "$versao" \
            --notes "Instale com BRAT (ojohnmf-glitch/obsidian-keep-notes) ou copie manifest.json, main.js e styles.css para .obsidian/plugins/keep-notes/." \
            manifest.json main.js styles.css
